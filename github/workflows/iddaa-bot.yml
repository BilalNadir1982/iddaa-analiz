name: İddaa Bot - Günlük Analiz

on:
  schedule:
    - cron: '30 8 * * *'      # Her gün 08:30 Türkiye saati
    - cron: '30 16 * * *'     # Her gün 16:30 Türkiye saati
  workflow_dispatch:          # Manuel çalıştırmak için buton

jobs:
  iddaa-analiz:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu İndir
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment Variables Oluştur
        run: |
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" > .env
          echo "CHANNEL_ID=${{ secrets.CHANNEL_ID }}" >> .env

      - name: Analizi Çalıştır
        run: python main.py --run-once
