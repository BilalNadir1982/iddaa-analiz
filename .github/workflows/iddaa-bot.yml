name: IDDAA BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Repo cek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Kutuphaneler
        run: pip install -r requirements.txt

      - name: Botu calistir
        run: python main.py
