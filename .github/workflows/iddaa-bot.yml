name: VIP İddaa Otomasyonu

on:
  schedule:
    - cron: '0 7,17,23 * * *' # Türkiye saatiyle sabah 10:00, akşam 20:00 ve gece 02:00 civarlarında otomatik tetiklenir
  workflow_dispatch: # İstediğin an elinle çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Botu Çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python main.py
