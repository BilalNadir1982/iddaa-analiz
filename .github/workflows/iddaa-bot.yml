name: Iddaa Analiz Bot Otomasyonu

on:
  schedule:
    # 1. Tetikleyici (UTC 06:00 -> TSİ 09:00 Sabah Kuponu)
    - cron: '0 6 * * *'
    # 2. Tetikleyici (UTC 20:30 -> TSİ 23:30 Gece Raporu)
    - cron: '30 20 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # SABAH KUPONUNU PAYLAŞ
      - name: Sabah Kuponunu Paylaş
        if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }} # Bu satırı eklediğinden emin ol!
        run: python main.py

      # GECE SONUÇ RAPORUNU PAYLAŞ
      - name: Gece Sonuç Raporunu Paylaş
        if: github.event.schedule == '30 20 * * *'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }} # Buraya da ekliyoruz
        run: python check_results.py
