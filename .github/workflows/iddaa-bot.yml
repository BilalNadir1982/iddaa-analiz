name: Bot Calistir

on:
  schedule:
    - cron: '0 9 * * *'  # Her sabah saat 09:00'da otomatik çalışır
  workflow_dispatch:     # Manuel olarak "Run workflow" tuşuna basmanı sağlar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu cek
        uses: actions/checkout@v3

      - name: Python kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Gerekli kutuphaneleri yukle
        run: |
          pip install requests beautifulsoup4

      - name: Botu calistir
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python main.py
